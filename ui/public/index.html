<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Agent Collab</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <div class="app">
    <aside class="sidebar" id="sidebar">
      <button class="workspace" id="workspaceBtn" type="button">
        <span class="workspace-mark" aria-hidden="true">A</span>
        <span class="workspace-meta">
          <strong id="workspaceName">Agent Collab</strong>
          <span id="repo" class="workspace-sub">…</span>
        </span>
      </button>

      <button class="side-search" id="openSearch" type="button">
        <span>Search</span>
        <kbd>⌘K</kbd>
      </button>

      <nav class="side-nav" aria-label="Workspace">
        <a class="side-link" data-route="board" href="#/board">
          <span class="ico" aria-hidden="true">▦</span> Board
        </a>
        <a class="side-link" data-route="tasks" href="#/tasks">
          <span class="ico" aria-hidden="true">☰</span> All tasks
        </a>
        <a class="side-link" data-route="activity" href="#/activity">
          <span class="ico" aria-hidden="true">◷</span> Activity
        </a>
      </nav>

      <div class="side-label">Projects</div>
      <nav class="side-pages" id="sidePages" aria-label="Projects"></nav>

      <div class="side-foot">
        <span id="live" class="live off">
          <span class="dot"></span>
          <span id="liveText">connecting…</span>
        </span>
        <button id="themeBtn" class="ghost" type="button" title="Toggle theme">Aa</button>
      </div>
    </aside>

    <div class="frame">
      <header class="crumbbar">
        <button id="sidebarToggle" class="ghost" type="button" aria-label="Toggle sidebar">☰</button>
        <nav class="crumbs" id="crumbs"></nav>
        <span id="updated" class="updated"></span>
      </header>
      <main class="canvas" id="page"></main>
    </div>
  </div>

  <div id="taskOverlay" class="overlay">
    <section id="taskModal" class="peek" role="dialog" aria-label="Task">
      <button id="taskClose" class="close" type="button" aria-label="Close">✕</button>
      <div id="taskBody"></div>
    </section>
  </div>

  <div id="cmdOverlay" class="overlay">
    <section class="cmdk" role="dialog" aria-label="Search">
      <input id="cmdInput" type="search" placeholder="Search projects and tasks…" autocomplete="off" />
      <div id="cmdResults" class="cmd-results"></div>
    </section>
  </div>

  <div id="toast" class="toast" hidden></div>
  <script src="/app.js"></script>
</body>
</html>
