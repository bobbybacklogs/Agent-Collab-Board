<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Local Board Dashboard</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="logo" aria-hidden="true">▦</span>
      <div>
        <h1>Local Board Dashboard</h1>
        <p class="repo" id="repo">…</p>
      </div>
    </div>
    <div class="topbar-right">
      <span id="live" class="live off" title="Live updates">
        <span class="dot"></span>
        <span id="liveText">connecting…</span>
      </span>
      <span id="updated" class="updated"></span>
    </div>
  </header>

  <main class="layout">
    <aside class="summary">
      <section class="panel focus" id="focus-panel">
        <h2>Current Focus</h2>
        <div id="focus-body"></div>
      </section>

      <section class="panel counts" id="counts-panel">
        <h2>Portfolio</h2>
        <div id="counts-body" class="counts"></div>
      </section>

      <section class="panel" id="aux-panel">
        <h2>Board Activity</h2>
        <div id="aux-body"></div>
      </section>
    </aside>

    <section class="board-area">
      <div class="board-toolbar">
        <div class="bt-left">
          <span class="bt-title">Board</span>
          <div class="colbtn-wrap">
            <button id="colsBtn" class="toolbtn">
              <span class="eye-ico" aria-hidden="true">◉</span> Columns
              <span id="colsCount" class="bt-count"></span>
            </button>
            <div id="colsPop" class="popover" hidden></div>
          </div>
          <button id="addColBtn" class="toolbtn primary">+ Custom column</button>
        </div>
        <div class="bt-right">
          <span id="colsHint" class="bt-hint"></span>
        </div>
      </div>
      <section class="board" id="board"
        aria-label="Projects grouped by board state and custom columns"></section>
    </section>
  </main>

  <div id="drawerOverlay" class="overlay">
    <aside id="drawer" class="drawer" role="dialog" aria-label="Project detail">
      <button id="drawerClose" class="close" aria-label="Close">✕</button>
      <div id="drawerBody"></div>
    </aside>
  </div>

  <div id="taskOverlay" class="overlay">
    <section id="taskModal" class="taskmodal" role="dialog" aria-label="Task detail">
      <button id="taskClose" class="close" aria-label="Close">✕</button>
      <div id="taskBody"></div>
    </section>
  </div>

  <div id="customOverlay" class="overlay">
    <section id="customModal" class="taskmodal colform" role="dialog" aria-label="Custom column">
      <button id="customClose" class="close" aria-label="Close">✕</button>
      <div id="customBody"></div>
    </section>
  </div>

  <div id="toast" class="toast" hidden></div>

  <script src="/app.js"></script>
</body>
</html>
